<!DOCTYPE html>

<title>For you 💌</title>
<style>
:root{
--blush:#ffd9e4; --lav:#e6d9f7; --rose:#c2527f; --plum:#6b2f55; --ink:#4a2340; --paper:#fffafc;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px 14px;
font-family:Georgia,"Palatino Linotype","Book Antiqua",serif; color:var(--ink);
background:linear-gradient(135deg,var(--blush),var(--lav),#fbe0ec,var(--lav));
background-size:300% 300%; animation:drift 18s ease-in-out infinite;
}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.card{
width:min(100%,540px); min-height:320px; padding:38px 26px 30px; text-align:center;
background:rgba(255,250,252,.78); border-radius:30px;
box-shadow:0 18px 50px rgba(150,70,120,.22), 0 0 0 1px rgba(255,255,255,.7) inset;
display:flex; flex-direction:column; justify-content:space-between; gap:26px;
opacity:1; transition:opacity .35s ease; position:relative; z-index:2;
}
.card.out{opacity:0}
.body{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center}
.line{font-size:clamp(1.55rem,6vw,2.2rem); line-height:1.35; font-style:italic; color:var(--plum); margin:0}
.sub{margin:14px 0 0; font-size:1.05rem; color:#8a5a78}
.poem{
width:100%; text-align:left; background:var(--paper); border:2px dashed #f0b3cb; border-radius:20px;
padding:20px 20px 6px; font-style:italic; font-size:clamp(.98rem,3.6vw,1.1rem); line-height:1.75;
}
.poem p{margin:0 0 18px}
.ask{display:flex; justify-content:center; align-items:flex-end; gap:22px; padding-top:4px}
.nowrap{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:110px}
.hint{min-height:1.4em; font-size:1rem; color:var(--rose); font-style:italic}
button{
font:inherit; font-size:1.05rem; border:0; border-radius:999px; padding:12px 28px; cursor:pointer;
transition:transform .15s ease, box-shadow .15s ease;
}
button:focus-visible{outline:3px solid var(--plum); outline-offset:3px}
button:active{transform:scale(.96)}
.next,.yes{background:linear-gradient(135deg,#e0658f,#b24e9a); color:#fff; box-shadow:0 8px 18px rgba(194,82,127,.35)}
.yes{position:relative; z-index:1001}
.no{background:#fff; color:var(--plum); box-shadow:0 0 0 2px #e8bfd2 inset}
.no.fly{position:fixed; z-index:1000; margin:0; transition:none}
.heart{position:fixed; top:-40px; z-index:1; pointer-events:none; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg); opacity:.85}}
#dot{position:fixed; left:6px; bottom:6px; width:12px; height:12px; padding:0; border-radius:50%;
background:#c2527f; opacity:.12; z-index:3000}
#panel{position:fixed; left:10px; bottom:26px; z-index:3000; display:none; background:#2d1a28; color:#fff;
padding:14px 16px; border-radius:14px; font:14px/1.5 system-ui,sans-serif; min-width:210px; text-align:left}
#panel.show{display:block}
#panel b{font-size:1.1rem}
#panel button{margin-top:8px; padding:6px 14px; font-size:.85rem; background:#fff; color:#2d1a28}
.emoji{font-size:2.6rem;line-height:1;margin-bottom:14px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.leave{background:#fff;color:var(--plum);box-shadow:0 0 0 2px #e8bfd2 inset}
#mute{position:fixed;left:10px;top:10px;z-index:3000;padding:6px 10px;font-size:1.1rem;background:rgba(255,255,255,.7);box-shadow:none}

.bar{width:100%;height:16px;background:#f3d3e2;border-radius:99px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f7a3c0,#b24e9a)}
.coupons,.choices{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:18px}

.choice{text-align:center}

#panel{max-width:min(280px,90vw);word-break:break-word}
.emoji.beat{animation:bump .6s ease-out}
@keyframes bump{0%{transform:scale(1)}14%{transform:scale(1.32)}28%{transform:scale(1)}42%{transform:scale(1.22)}60%,100%{transform:scale(1)}}

.lt-hint{font-size:1rem;color:var(--rose);font-style:italic;min-height:1.4em}
.env{position:relative;width:min(100%,300px);height:190px;margin-top:56px;cursor:pointer;perspective:700px;-webkit-tap-highlight-color:transparent;
transition:opacity .7s,height .8s,margin .8s,transform .8s}
.env.tap{animation:shake .25s}
@keyframes shake{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.env-back{position:absolute;inset:0;background:#e9a2bc;border-radius:8px;box-shadow:0 10px 24px rgba(150,70,120,.28)}
.env-paper{position:absolute;left:12px;right:12px;top:16px;bottom:12px;background:#fffdf8;border-radius:6px;z-index:1;
box-shadow:0 2px 6px rgba(0,0,0,.1);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.env-paper::before{content:"";position:absolute;left:16px;right:16px;top:18px;height:56px;
background:repeating-linear-gradient(#eadfe6 0 2px,transparent 2px 12px)}
.env-front{position:absolute;inset:0;background:#f7c3d4;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:2}
.flap{position:absolute;left:0;right:0;top:0;height:56%;background:#ee9fbb;clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;transition:transform .25s ease,background .2s;z-index:3}
.flap.in{background:#d97ea3}
.env.open .flap{z-index:0}
.env.open .env-paper{transform:translateY(-48%)}
.env.gone{opacity:0;height:0;margin:0;transform:translateY(24px) scale(.9);pointer-events:none}
.env.instant,.env.instant *{transition:none!important}
.letter{width:100%;max-height:0;overflow:hidden;opacity:0;transform:translateY(40px) scale(.92)}
.letter.show{max-height:3000px;opacity:1;transform:none;transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.letter.instant{transition:none!important}
.letter .poem{border-style:solid;box-shadow:0 8px 24px rgba(150,70,120,.18)}
.fadein{animation:fadein .6s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
.prev{position:absolute;left:12px;top:10px;padding:6px 12px;font-size:.9rem;background:transparent;color:#8a5a78;box-shadow:none}
#bye{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:linear-gradient(135deg,#ffd9e4,#e6d9f7);color:var(--plum);font-size:clamp(1.6rem,6vw,2.4rem);font-style:italic}
#bye small{font-size:1rem;color:#8a5a78;font-style:normal}
.fields{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:18px;text-align:left}

@media (prefers-reduced-motion:reduce){body{animation:none}.card{transition:none}.emoji,#spidey{animation:none}}

/* ---- Text entrance animations ---- */
.fxc{display:inline-block;opacity:0;white-space:pre}
.fxw{display:inline-block;opacity:0}
.fx-1 .fxc{animation:a-type .01s forwards}
@keyframes a-type{to{opacity:1}}
.fx-2{animation:a-blur 1.2s ease both}
@keyframes a-blur{from{opacity:0;filter:blur(18px);transform:scale(1.15)}to{opacity:1;filter:blur(0);transform:none}}
.fx-3 .fxw{animation:a-drop .8s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes a-drop{from{opacity:0;transform:translateY(-70px)}to{opacity:1;transform:none}}
.fx-4{animation:a-flip 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 50%}
@keyframes a-flip{from{opacity:0;transform:perspective(600px) rotateX(-90deg)}to{opacity:1;transform:perspective(600px) rotateX(0)}}
.fx-5{animation:a-left .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes a-left{from{opacity:0;transform:translateX(-90px) skewX(12deg)}to{opacity:1;transform:none}}
.fx-6 .fxc{animation:a-wave .7s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes a-wave{from{opacity:0;transform:translateY(34px) scale(.5)}to{opacity:1;transform:none}}
.fx-7{animation:a-zoom .9s cubic-bezier(.3,1.7,.5,1) both}
@keyframes a-zoom{from{opacity:0;transform:scale(.15)}to{opacity:1;transform:none}}
.fx-8{animation:a-curtain 1.1s cubic-bezier(.7,0,.2,1) both}
@keyframes a-curtain{from{clip-path:inset(0 50% 0 50%);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.fx-9 .fxw{animation:a-spin .8s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes a-spin{from{opacity:0;transform:rotate(-200deg) scale(.2)}to{opacity:1;transform:none}}
.fx-10{animation:a-track 1.4s ease both}
@keyframes a-track{from{opacity:0;letter-spacing:.6em;filter:blur(6px)}to{opacity:1;letter-spacing:0;filter:none}}
.fx-11{animation:a-right .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes a-right{from{opacity:0;transform:translateX(90px) skewX(-12deg)}to{opacity:1;transform:none}}
.fx-12{animation:a-swing 1.3s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% -40px}
@keyframes a-swing{0%{opacity:0;transform:translateY(-60px) rotate(-25deg)}60%{opacity:1;transform:rotate(8deg)}80%{transform:rotate(-4deg)}100%{transform:none}}
.fxp{animation:a-poem 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes a-poem{from{opacity:0;transform:translateY(40px) rotate(-1.5deg) scale(.94)}to{opacity:1;transform:none}}
.emoji.pop{animation:a-pop .7s cubic-bezier(.3,1.8,.5,1) both}
@keyframes a-pop{from{opacity:0;transform:scale(0) rotate(-120deg)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
.blob{animation:none}
[class*="fx-"],[class*="fx-"] *,.fxp,.emoji.pop{animation:none!important;opacity:1!important;transform:none!important}
}

<script>
(function(){
var KEY="proposal_answer", CLICKS="proposal_no_clicks", WHY="proposal_reason", DATE="proposal_date", PLAN="proposal_plan", CANCEL="proposal_cancel";
var lines=[
"i always wanted to tell u this",
"but i never had the courage to say it",
"but now I am Fully prepared",
"hope u didn’t mind",
"i am spiderman",
"just kidding",

var poem1=[
`I don’t know when it happened, or how you became so dear,

`I cannot promise every day will be a perfect rhyme,

var noMsgs=["didn’t get it try again","Why 🥺","please 🙏","try again 😌"];

var card=document.getElementById("card");
var panel=document.getElementById("panel");
var idx=0, noCount=0, dodgeTimer=null, heartTimer=null, mem={};

function store(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){mem[k]=v}}
function load(k){try{var v=localStorage.getItem(k);return v===null?(mem[k]||null):v}catch(e){return mem[k]||null}}

/* ---------- Sound (all synthesized, offline) ---------- */
var AC=null, master=null, ambLP=null, muted=false, ambTimer=null, ambStep=0, leftSite=false, curTrack="intro";
var tracks={
intro:{n:[523.25,659.25,783.99,659.25,587.33,783.99,880,659.25,523.25,587.33,659.25,392,440,523.25,587.33,659.25],ms:650,pk:.035,type:"sine",b:[130.81],be:8},
yes:{n:[523.25,659.25,783.99,1046.5,783.99,659.25,880,783.99,698.46,880,1046.5,880,783.99,659.25,587.33,659.25],ms:360,pk:.05,type:"triangle",b:[130.81,174.61,196,130.81],be:4},
no:{n:[440,523.25,659.25,523.25,392,440,523.25,440,349.23,440,523.25,440,329.63,392,440,392],ms:950,pk:.03,type:"sine",b:[110,87.31,98,110],be:4}
};
function ensureAudio(){
try{
if(!AC){
var C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
AC=new C(); master=AC.createGain(); master.gain.value=muted?0:1; master.connect(AC.destination);
ambLP=AC.createBiquadFilter(); ambLP.type="lowpass"; ambLP.frequency.value=1600;
var d=AC.createDelay(); d.delayTime.value=.38; var fb=AC.createGain(); fb.gain.value=.42;
ambLP.connect(master); ambLP.connect(d); d.connect(fb); fb.connect(d); d.connect(master);
}
if(AC.state!=="running")AC.resume();
return AC;
}catch(e){return null}
}
function tone(f,t,dur,type,peak,dest,glideTo){
var o=AC.createOscillator(),g=AC.createGain();
o.type=type; o.frequency.setValueAtTime(f,t);
if(glideTo)o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+.02);
g.gain.exponentialRampToValueAtTime(.0001,t+dur);
o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+dur+.05);
}
function startAmbient(){
if(leftSite||!ensureAudio()||ambTimer)return;
var T=tracks[curTrack];
ambTimer=setInterval(function(){
var t=AC.currentTime+.02, d=T.ms/1000;
tone(T.n[ambStep%T.n.length],t,d*3.5,T.type,T.pk,ambLP);
if(ambStep%T.be===0)tone(T.b[Math.floor(ambStep/T.be)%T.b.length],t,d*T.be*1.1,"sine",T.pk*1.2,ambLP);
ambStep++;
},T.ms);
}
function setMusic(n){
curTrack=n; ambStep=0;
if(ambTimer){clearInterval(ambTimer);ambTimer=null}
startAmbient();
}
function stopMusic(){
leftSite=true;
if(ambTimer){clearInterval(ambTimer);ambTimer=null}
if(AC){try{master.gain.value=0;AC.suspend()}catch(e){}}
}
function resumeAudio(){
leftSite=false;
if(AC){try{AC.resume();master.gain.value=muted?0:1}catch(e){}}
}
function voice(f0a,f0b,dur,fm1,fm2,peak){
var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),b1=AC.createBiquadFilter(),b2=AC.createBiquadFilter(),v=AC.createOscillator(),vg=AC.createGain();
o.type="sawtooth"; o.frequency.setValueAtTime(f0a,t); o.frequency.linearRampToValueAtTime(f0b,t+dur);
v.frequency.value=6; vg.gain.value=f0a*.02; v.connect(vg); vg.connect(o.frequency);
b1.type="bandpass"; b2.type="bandpass"; b1.Q.value=6; b2.Q.value=6;
b1.frequency.setValueAtTime(fm1[0],t); b1.frequency.linearRampToValueAtTime(fm1[1],t+dur);
b2.frequency.setValueAtTime(fm2[0],t); b2.frequency.linearRampToValueAtTime(fm2[1],t+dur);
g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+.04);
g.gain.setValueAtTime(peak,t+dur*.7); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
o.connect(b1); o.connect(b2); b1.connect(g); b2.connect(g); g.connect(master);
o.start(t); v.start(t); o.stop(t+dur+.05); v.stop(t+dur+.05);
}

[523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,t+i*.07,.25,"triangle",.2)});

<script>
(function(){
var card=document.getElementById("card"); if(!card)return;
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;

["a","b","c"].forEach(function(c){var d=document.createElement("div");d.className="blob "+c;document.body.appendChild(d)});

var seen={}, count=0, TOTAL=12;
function plain(el){for(var i=0;i<el.childNodes.length;i++)if(el.childNodes[i].nodeType!==3)return false;return true}
function split(el,mode,step){
var txt=el.textContent, out="", n=0;
if(mode==="c"){
txt.split(/(\s+)/).forEach(function(w){
if(/^\s+$/.test(w)){out+=w;return}
out+='<span style="display:inline-block;white-space:nowrap">';
w.split("").forEach(function(ch){
out+='<span class="fxc" style="animation-delay:'+(n++*step)+'ms">'+ch.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span>';
});
out+='</span>';
});
}else{
txt.split(/(\s+)/).forEach(function(w){
if(/^\s+$/.test(w)){out+=w;return}
out+='<span class="fxw" style="animation-delay:'+(n++*step)+'ms">'+w.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span>';
});
}
el.innerHTML=out;
}
function apply(){
var line=card.querySelector(".line:not([data-fx])");
var poem=card.querySelector(".poem:not([data-fx])");
var em=card.querySelector(".emoji");
var target=line||poem; if(!target)return;
var key=(target.textContent||"").trim().slice(0,60);
if(!(key in seen)){seen[key]=(count++%TOTAL)+1}
var n=seen[key];
target.setAttribute("data-fx","1");
if(em){em.classList.remove("pop");void em.offsetWidth;em.classList.add("pop")}
if(reduce)return;
if(target===poem){target.classList.add("fxp");return}
if(!plain(target))return;
if(target.textContent.length>70){target.classList.add("fx-"+n);return}
if(n===1){split(target,"c",55)}
else if(n===6){split(target,"c",35)}
else if(n===3){split(target,"w",140)}
else if(n===9){split(target,"w",150)}
target.classList.add("fx-"+n);
}
var deb;
new MutationObserver(function(){clearTimeout(deb);deb=setTimeout(apply,50)}).observe(card,{childList:true,subtree:true});
apply();
})();
</script>
